<!DOCTYPE html>
<html>
  <head>
    <!-- Librerie per far funzionare AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs>
      <a-assets>
        <!-- CAMBIA "il-tuo-modello.glb" con il nome esatto del tuo file .glb -->
        <a-asset-item id="dragon" src="./dragon.glb"></a-asset-item>
      </a-assets>

      <!-- Se usi il marker Hiro standard lascia preset="hiro". 
           Se usi un tuo marker personalizzato, usa: type="pattern" url="tuo-marker.patt" -->
      <a-marker type="pattern" url="./pattern-marker.patt">
        <a-entity 
          gltf-model="#dragon" 
          scale="0.5 0.5 0.5" 
          position="0 0 0">
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
